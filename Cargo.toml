[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.6"
authors = ["Stephen Diehl <stephen.m.diehl@gmail.com>"]
categories = ["algorithms", "mathematics"]
edition = "2024"
homepage = "https://github.com/sdiehl/polycore"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sdiehl/polycore"
rust-version = "1.88"

[workspace.dependencies]
insta = { version = "1.41", features = ["glob"] }
machine-prime = "1.5.7"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
polycore = { path = "crates/polycore", version = "0.1.6" }
rand_xoshiro = "0.8.1"
rayon = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
